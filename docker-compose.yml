services:
  db:
    image: postgres:14.5
    restart: always
    env_file:
      - ./.env
    command: postgres -c max_connections=500
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  cache:
    image: redis:8.0.2
    restart: always
    env_file:
      - ./.env
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data

  rq:
    build: .
    restart: always
    env_file:
      - ./.env
    environment:
      REDIS_HOST: cache
      REDIS_PORT: 6379
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    command: bash -c "python manage.py rqworker --with-scheduler"
    volumes:
      - .:/webPerformers
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy

volumes:
  redis_data:
  pgdata: