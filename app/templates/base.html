{% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="en" class="h-full bg-white dark:bg-gray-900">

<head>
    <title>{% block title %} {% endblock %}</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="icon" type="image/png" href="{% static 'img/icon.png' %}">
    <style>[x-cloak]{display:none!important;}</style>
    {% block extra_css %} {% endblock %}
    {% tailwind_css %}
</head>

<body hx-headers='{"x-csrftoken": "{{ csrf_token }}"}' class="h-full bg-slate-50 text-slate-900 antialiased" x-data="{ sidebarOpen: false }">
    {% include 'components/navigation/side/sidebar.html' %}
    <div class="min-h-full lg:pl-72">
        {% include 'components/navigation/top/header.html' %}
        <main class="py-8 sm:py-10">
            <div class="px-4 sm:px-6 lg:px-8">
                {% block content %}
                {% endblock %}
            </div>
        </main>
    </div>

    <script src="{% static 'js/alpine_min.js' %}"></script>
    <script src="{% static 'js/htmx_min.js' %}"></script>
</body>

</html>
