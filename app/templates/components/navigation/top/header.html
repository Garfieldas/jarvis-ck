<header class="sticky top-0 z-40 flex h-16 items-center border-b border-slate-200 bg-white/90 px-4 backdrop-blur-sm sm:px-6 lg:px-8">
  <div class="flex w-full items-center justify-between">
    <div class="flex items-center gap-3">
      <button type="button" class="-m-2 p-2 text-slate-600 hover:text-slate-900 lg:hidden" @click="sidebarOpen = true">
        <span class="sr-only">Open sidebar</span>
        <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path d="M4 7h16M4 12h16M4 17h16" stroke-linecap="round" />
        </svg>
      </button>
      <span class="text-sm font-semibold text-slate-900">Jarvis</span>
    </div>

    <div class="relative" x-data="{ profileOpen: false }">
      <button type="button" class="flex h-10 w-10 items-center justify-center rounded-full bg-slate-900 text-sm font-semibold text-white shadow-sm transition hover:bg-slate-700" @click="profileOpen = !profileOpen" @keydown.escape.window="profileOpen = false" aria-haspopup="menu" x-bind:aria-expanded="profileOpen" aria-label="User profile menu">
        <span class="sr-only">Open profile menu</span>
        {% if request.user.is_authenticated and request.user.email %}
          {{ request.user.email|slice:":1"|upper }}
        {% elif request.user.is_authenticated and request.user.get_username %}
          {{ request.user.get_username|slice:":1"|upper }}
        {% else %}
          U
        {% endif %}
      </button>

      <div class="absolute right-0 mt-2 w-52 rounded-xl border border-slate-200 bg-white p-2 shadow-lg" x-show="profileOpen" x-transition x-cloak @click.outside="profileOpen = false" role="menu">
        <div class="rounded-lg px-3 py-2 text-xs text-slate-500">
          {% if request.user.is_authenticated and request.user.email %}
            {{ request.user.email }}
          {% elif request.user.is_authenticated and request.user.get_username %}
            {{ request.user.get_username }}
          {% else %}
            Guest
          {% endif %}
        </div>
        <form method="post" action="{% url 'logout' %}">
          {% csrf_token %}
          <button type="submit" class="flex w-full items-center gap-2 rounded-lg px-3 py-2 text-left text-sm text-slate-700 transition hover:bg-slate-100" role="menuitem">
            <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <path d="M15 17 20 12 15 7M20 12H9" stroke-linecap="round" stroke-linejoin="round" />
              <path d="M11 20H7a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h4" stroke-linecap="round" />
            </svg>
            Logout
          </button>
        </form>
      </div>
    </div>
  </div>
</header>
